<script>
// ================= Mock =================
const ME='wangyixuan@xiaomi.com';
const BIZ={miads:'广告-Miads',api:'广告-API'};
const ROLES={all:['miads','api'],api:['api'],miads:['miads']};
const RATE={USD:1,EUR:0.92,INR:84.1};
let role='all';
const SEATS=[['nextsmart_rtb_ssp','Nextsmart',1],['nextsmart_rtb_wps','Nextsmart',1],['nextsmart_rtb','Nextsmart',1],['yidian','Yidian',1],['yidian_rtb','Yidian',1],['minigo','Minigo',1],['bigo_ads','BIGO',1],['adtiming','AdTiming',0],['appier_rtb','Appier',1],['topon_rtb','topon',1],['vungle_rtb','vungle_rtb',1],['magnite_rtb','magnite_rtb',1],['Iflytec_rtb_ssp','Iflytec',1],['smadex_rtb','smadex_rtb',1]];
let sel=new Set(),msOpen=null;
function msPop(c){return `<div class="pop"><input placeholder="搜索 seat / 公司名称" style="margin-bottom:6px"><div style="max-height:200px;overflow:auto">${SEATS.slice(0,8).map(x=>`<label><input type="checkbox" data-seat="${x[0]}" ${c.dsp.includes(x[0])?'checked':''}>${x[0]} - ${x[1]}${x[2]?'':' <span class="muted">（已关闭）</span>'}</label>`).join('')}</div><div class="muted" style="font-size:12px;padding:4px">选项来自丘比特 DSP 列表（含已关闭），至少选 1 个；勾选即保存，从下一次取数生效</div></div>`}

const contractsApi=[
  {code:'S003375',dsp:['nextsmart_rtb_ssp','nextsmart_rtb_wps','nextsmart_rtb'],ri:'revenue_valid',sales:'Tridev Deka',cur:'USD',by:ME,flag:'系统计提',t:'2026-12-01 10:02',ub:'system'},
  {code:'S001283',dsp:['yidian','yidian_rtb'],ri:'revenue_3h',sales:'Zhang Wei',cur:'USD',by:ME,flag:'系统计提',t:'2026-12-01 10:02',ub:'system'},
  {code:'S002918',dsp:['minigo'],ri:'revenue',sales:'Li Na',cur:'EUR',by:ME,flag:'手工计提',t:'2026-12-01 10:02',ub:'system'},
  {code:'C2023-0412',dsp:['bigo_ads'],ri:'revenue_valid',sales:'Ravi Kumar',cur:'USD',by:ME,flag:'系统计提',t:'2026-12-01 00:00',ub:'system'},
  {code:'C2022-1180',dsp:['adtiming'],ri:'revenue_valid',sales:'Ravi Kumar',cur:'EUR',by:'liukai@xiaomi.com',flag:'不计提',t:'2026-12-03 14:20',ub:ME},
];
const contractsMiads=[
  {code:'S000588',acc:'1509',sales:'Tridev Deka',cur:'INR',by:'v-gongshiyang@xiaomi.com',flag:'系统计提',ind:'否',reb:'否',t:'2026-11-11 16:00',ub:'p-daizhijian@xiaomi.com'},
  {code:'S000582',acc:'1488',sales:'Tridev Deka',cur:'INR',by:'v-gongshiyang@xiaomi.com',flag:'系统计提',ind:'否',reb:'否',t:'2026-11-10 14:39',ub:'p-daizhijian@xiaomi.com'},
  {code:'S000578',acc:'1339',sales:'Tridev Deka',cur:'INR',by:'v-gongshiyang@xiaomi.com',flag:'系统计提',ind:'否',reb:'否',t:'2026-11-10 14:39',ub:'p-daizhijian@xiaomi.com'},
];
const RI=c=>(contractsApi.find(x=>x.code===c)||{}).ri||'revenue_valid';
const COUNTRY=['ID','IN','BR','MX','RU'],MEDIA=['海外联盟业务-程序化','海外浏览器','海外应用商店'];
let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const r2=n=>Math.round(n*100)/100;
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

const BIZ_ALL=['广告-Miads','广告-API','广告-云端预装','广告-SDK','预装-海外'];
let formulas=[
  {type:'近X天平均值预估',x:5,biz:['广告-Miads','广告-API'],upd:ME,t:'2026-12-02 10:21'},
  {type:'日均推算',x:null,biz:[],upd:'system',t:'2026-12-01 00:00'},
];
const EXPR={'近X天平均值预估':'T-1实际累计 + 近X天日均 × 剩余天数','日均推算':'T-1实际累计 ÷ 已过天数 × 当月天数'};
const formulaFor=(biz)=>formulas.find(f=>f.biz.includes(BIZ[biz]))||formulas[0];
// 演示：T-1=12-10，已过10天，当月31天，近X天累计取最后X天
function estimate(f,actual){const el=10,days=31;if(f.type==='日均推算')return r2(actual/el*days);const x=Math.min(f.x,el);const nearX=actual*x/el*(0.9+rnd()*0.2);return r2(actual+nearX/x*(days-el))}

let sessions=[
  {id:'s1',biz:'api',month:'2026-12',type:'当月预估',by:ME,status:'调整预估',t:'2026-12-11 19:40'},
  {id:'s2',biz:'api',month:'2026-11',type:'当月预估',by:ME,status:'已推送',t:'2026-11-30 18:20'},
  {id:'s3',biz:'api',month:'2026-10',type:'补计提',by:'liukai@xiaomi.com',status:'推送预览',t:'2026-12-02 11:05'},
  {id:'s4',biz:'api',month:'2026-11',type:'当月预估',by:'liukai@xiaomi.com',status:'调整预估',t:'2026-11-30 21:10'},
  {id:'m1',biz:'miads',month:'2026-11',type:'当月预估',by:'wangbin57@xiaomi.com',status:'已推送',t:'2026-11-10 15:18',off:'合并'},
  {id:'m2',biz:'miads',month:'2026-11',type:'当月预估',by:'v-zhangzijing1@xiaomi.com',status:'扣除赔付',t:'2026-11-11 20:12',off:'拆分'},
];
let records=[
  {id:'R20261130003',biz:'api',month:'2026-11',type:'收入计提',by:ME,c:4,d:7,i:16,amt:298430.11,st:'部分合同失败',t:'2026-11-30 18:20',
   cs:[{code:'S001283',st:'失败',n:4,why:'媒体名称不存在 1 条',amt:70818.42},{code:'C2023-0412',st:'失败',n:3,why:'签名校验失败',amt:85476.76},{code:'S003375',st:'成功',n:6,why:'',amt:131786.33},{code:'S002918',st:'成功',n:3,why:'',amt:10348.60}],
   dt:[['S001283','ID','海外浏览器',22410.05,'失败','媒体名称不存在'],['S001283','BR','海外应用商店',18200.37,'失败',''],['S001283','MX','海外浏览器',16522.00,'失败',''],['S001283','RU','海外联盟业务-程序化',13686.00,'失败',''],['C2023-0412','ID','海外应用商店',40210.76,'失败',''],['C2023-0412','IN','海外浏览器',30066.00,'失败',''],['C2023-0412','BR','海外浏览器',15200.00,'失败','']]},
  {id:'R20261130001',biz:'api',month:'2026-11',type:'收入计提',by:ME,c:4,d:7,i:22,amt:412880.31,st:'推送成功',t:'2026-11-30 10:20'},
  {id:'R20261130002',biz:'miads',month:'2026-11',type:'收入计提',by:ME,c:12,i:1158,amt:2164759.60,st:'推送成功',t:'2026-11-30 17:02'},
];

// 草稿：合同×DSP 聚合，明细 国家×媒体
let drafts=[];
function buildDrafts(){
  seed=7;drafts=[];const f=formulaFor('api');
  contractsApi.filter(c=>c.by===ME&&c.flag==='系统计提').forEach(c=>c.dsp.forEach(d=>{
    const n=2+Math.floor(rnd()*3),used=new Set(),det=[];
    while(det.length<n){const co=COUNTRY[Math.floor(rnd()*5)],m=MEDIA[Math.floor(rnd()*3)];if(used.has(co+m))continue;used.add(co+m);
      const a=r2(800+rnd()*12000),e=estimate(f,a);det.push({country:co,media:m,actual:a,est:e,adj:e,reason:''});}
    drafts.push({contract:c.code,cur:c.cur,ri:c.ri,dsp:d,det,open:false,reason:'',changed:false});
  }));
}

// ================= 状态 =================
let page='accrual',tab={accrual:'api',contract:'api',records:'api'},sess=null,step=0,cfgTab='formula',ff={biz:'',by:''},pv={};
const allowed=()=>ROLES[role];
const $=s=>document.querySelector(s);
function curTab(k){if(!allowed().includes(tab[k]))tab[k]=allowed()[0];return tab[k]}
function bizTabs(k,prefix=''){return `<div class="tabs">${['miads','api'].map(b=>allowed().includes(b)
  ?`<div class="${tab[k]===b?'on':''}" data-tab="${k}:${b}">${prefix}${BIZ[b]}</div>`:`<div class="lock" title="无该 Tab 权限">${prefix}${BIZ[b]} 🔒</div>`).join('')}</div>`}

function render(){
  document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.p===page));
  $('#crumb').textContent={accrual:'收入计提',contract:'合同管理',records:'计提记录',config:'配置管理',rebate:'返点计提',user:'用户管理'}[page];
  $('#bar').innerHTML='';
  $('#main').innerHTML={accrual:rAccrual,contract:rContract,records:rRecords,config:rConfig,rebate:()=>`<h2>返点计提</h2><div class="alert">返点计提只属于广告-Miads，本期不变。</div>`,user:rUser}[page]();
  bind();
}
function bar(l,r){$('#bar').innerHTML=`<div class="bar"><div>${l}</div><div class="row">${r}</div></div>`}

// ================= 收入计提 =================
function rAccrual(){
  const b=curTab('accrual');
  if(sess) return rSession();
  const f=formulaFor(b);
  const miads=b==='miads';
  const form=`<div class="grid">
    <div class="f"><label><em>*</em>计提类型</label><select><option>当月预估计提</option><option>补计提</option></select></div>
    <div class="f"><label><em>*</em>计提月份</label><input value="2026-12" disabled></div>
    ${miads?`<div class="f"><label><em>*</em>Offline 计提规则</label><select><option>合并计提</option></select></div><div class="f"><label>是否拆包</label><select><option>否</option></select></div>`:''}
    <div class="f" style="grid-column:span 2"><label><em>*</em>计提人</label><input value="${ME}"></div>
    <div class="f"><label>合同ID</label><input placeholder="可选"></div>
    ${miads?`<div class="f"><label>包名</label><input placeholder="可选"></div><div class="f"><label>账户ID</label><input placeholder="可选"></div>`:`<div class="f"><label>DSP<span class="new">新</span></label><input placeholder="可选"></div>`}
  </div>
  <div class="row" style="margin-top:12px"><span class="muted">可选月份: 2026-12</span><span class="sp"></span><button class="pri" id="start">开始计提</button></div>`;
  const list=sessions.filter(s=>s.biz===b&&s.status!=='已推送'&&s.status!=='已作废'&&!(s.type==='当月预估'&&s.month!=='2026-12'));
  return `<h2>收入计提</h2><div class="sub">当月预估计提 / 补计提：筛选 → 取数 → 调整预估 → 人工补充(可选)${miads?' → 扣除赔付':''} → 推送 CRM</div>
  ${bizTabs('accrual')}
  <div class="card"><div class="hd">发起计提</div><div class="bd">${form}</div></div>
  <div class="card"><div class="hd">进行中的计提(断点续作)<span class="muted" style="font-weight:400;font-size:12px">推送后的计提不在此展示，推送结果请到「<a style="color:#4361ee">计提记录</a>」查看</span></div><div class="bd" style="padding:0">
  <table><tr><th>计提月份</th><th>计提类型</th><th>计提人</th><th>状态</th>${miads?'<th>Offline</th>':''}<th>更新时间</th><th>操作</th></tr>
  ${list.map(s=>`<tr><td><b>${s.month}</b></td><td>${s.type}</td><td>${s.by}</td><td><span class="tag ${s.status==='已推送'?'ok':s.status==='推送预览'?'w':'b'}">${s.status}</span></td>${miads?`<td>${s.off}</td>`:''}<td>${s.t}</td>
    <td><button class="link" data-cont="${s.id}">继续计提</button><button class="link d" data-void="${s.id}">作废</button></td></tr>`).join('')}</table></div></div>`;
}
const STEPS=['取数','调整预估','人工补充','推送预览'];const ICON=['🔍','✎','📄','☁'];
function rSession(){
  const steps=`<div class="steps">${STEPS.map((s,i)=>`${i?`<div class="ln ${i<=step?'done':''}"></div>`:''}<div class="s ${i===step?'on':i<step?'done':''}">${ICON[i]} ${s}</div>`).join('')}</div>`;

function aggRow(d,i,editable){
  const est=sum(d.det,x=>x.est),adj=sum(d.det,x=>x.adj),diff=r2(adj-est);
  let h=`<tr class="agg ${d.changed?'chg':''}"><td class="x" data-tog="${i}">${d.open?'−':'+'}</td><td>${d.contract}</td><td><span class="tag p">${d.dsp}</span></td><td><span class="ri">${d.ri}</span></td><td>-</td><td>-</td>
    <td class="n">${fmt(sum(d.det,x=>x.actual))}</td><td class="n">${fmt(est)}</td>
    <td class="n">${editable?`<input class="amt" data-agg="${i}" value="${adj.toFixed(2)}">`:fmt(adj)}</td>
    ${editable?`<td class="n" style="color:${diff?'#d46b08':''}">${diff?fmt(diff):'-'}</td><td><input data-ar="${i}" value="${d.reason}" placeholder="${d.changed?'必填':'可选'}" style="width:140px;${d.changed&&!d.reason?'border-color:#ff4d4f;background:#fff2f0':''}"></td><td>${ME}</td>`:''}</tr>`;
  if(d.open) d.det.forEach((x,j)=>h+=`<tr class="det"><td></td><td>${d.contract}</td><td>${d.dsp}</td><td></td><td>${x.country}</td><td>${x.media}</td><td class="n">${fmt(x.actual)}</td><td class="n">${fmt(x.est)}</td>
    <td class="n">${editable?`<input class="amt" data-det="${i}-${j}" value="${x.adj.toFixed(2)}">`:fmt(x.adj)}</td>${editable?`<td class="n">${x.adj-x.est?fmt(r2(x.adj-x.est)):'-'}</td><td></td><td>${ME}</td>`:''}</tr>`);
  return h;
}

function closeModal(){$('#mask').classList.remove('on')}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeModal()};
function splitTotal(d,total){const pos=d.det.map(x=>Math.max(x.actual,0)),P=sum(pos,x=>x);let acc=0;
  d.det.forEach((x,j)=>{if(j===d.det.length-1)x.adj=r2(total-acc);else{x.adj=r2(P?total*pos[j]/P:total/d.det.length);acc+=x.adj}})}
function bind(){
  const all=(s,f)=>document.querySelectorAll(s).forEach(f);const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  all('[data-tab]',e=>e.onclick=()=>{const [k,b]=e.dataset.tab.split(':');tab[k]=b;render()});
  all('[data-go]',e=>e.onclick=()=>{step=+e.dataset.go;render()});
  on('start',()=>{if(tab.accrual==='miads'){modal(`<h3>广告-Miads</h3><p>广告-Miads 计提流程与现网一致，本 demo 只演示广告-API。</p><div class="foot"><button class="pri" onclick="closeModal()">知道了</button></div>`);return}
    buildDrafts();sess={month:'2026-12'};step=0;pv={};render()});
  all('[data-cont]',e=>e.onclick=()=>{if(tab.accrual==='miads')return;buildDrafts();sess={month:sessions.find(s=>s.id===e.dataset.cont).month};step=1;pv={};render()});
  all('[data-void]',e=>e.onclick=()=>modal(`<h3>确认作废？</h3><p>作废后该计提会话不可恢复。</p><div class="foot"><button onclick="closeModal()">取消</button><button class="pri" id="vok">作废</button></div>`)||($('#vok').onclick=()=>{sessions=sessions.filter(s=>s.id!==e.dataset.void);closeModal();render()}));
  on('back',()=>{sess=null;render()});
  setTimeout(()=>{on('regather',()=>{buildDrafts();render()});on('push',doPush);on('saveAdj',()=>{if(check()){drafts.forEach(d=>d.saved=true);render()}});on('adjNext',()=>{if(check()){step=2;render()}});all('[data-go]',e=>e.onclick=()=>{step=+e.dataset.go;render()})});
  all('[data-tog]',e=>e.onclick=()=>{const d=drafts[+e.dataset.tog];d.open=!d.open;render()});
  all('[data-pv]',e=>e.onclick=()=>{pv[e.dataset.pv]=!pv[e.dataset.pv];render()});
  all('[data-agg]',e=>e.onchange=()=>{const d=drafts[+e.dataset.agg],v=parseFloat(e.value);if(isNaN(v)||v<0){alert('调整后预估不能为负数');return render()}splitTotal(d,v);d.changed=true;d.saved=false;d.open=true;render()});
  all('[data-det]',e=>e.onchange=()=>{const [i,j]=e.dataset.det.split('-').map(Number),v=parseFloat(e.value);if(isNaN(v)||v<0)return render();drafts[i].det[j].adj=v;drafts[i].changed=true;drafts[i].saved=false;render()});
  all('[data-ar]',e=>e.oninput=()=>{drafts[+e.dataset.ar].reason=e.value});
  on('sync',()=>modal(`<h3>同步合同数据</h3><p>同步完成，共新增 1 条数据，更新 3 条数据。</p><p class="muted">只同步 CRM 三级业务线 = 广告-API 新产生的合同，DSP 名称默认取客户简称。</p><div class="foot"><button class="pri" onclick="closeModal()">知道了</button></div>`));
  all('[data-sel]',e=>e.onchange=()=>{const i=+e.dataset.sel;e.checked?sel.add(i):sel.delete(i);render()});
  all('[data-ms]',e=>e.onclick=()=>{msOpen=msOpen===+e.dataset.ms?null:+e.dataset.ms;render()});
  all('[data-rd]',e=>e.onclick=()=>{recOpen=e.dataset.rd;render()});
  const rq=$('#rq');if(rq)rq.onchange=()=>{recQ=rq.value.trim();render()};
  on('rback',()=>{recOpen=null;rf={c:'',w:false};render()});
  all('[data-rc]',e=>e.onclick=()=>{rf.c=e.dataset.rc;render()});
  const rfc=$('#rfc');if(rfc)rfc.onchange=()=>{rf.c=rfc.value;render()};
  const rfw=$('#rfw');if(rfw)rfw.onchange=()=>{rf.w=rfw.checked;render()};
  on('rfx',()=>{rf.c='';render()});
  all('[data-flag]',e=>e.onchange=()=>{const [b,i]=e.dataset.flag.split(':');(b==='api'?contractsApi:contractsMiads)[+i].flag=e.value});
  all('[data-fe]',e=>e.onclick=()=>fModal(+e.dataset.fe));
}
function dspModal(){
  let picked=new Set();
  const draw=q=>SEATS.filter(x=>!q||(x[0]+x[1]).toLowerCase().includes(q.toLowerCase())).map(x=>`<label style="display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer"><input type="checkbox" style="width:auto;height:auto" data-seat="${x[0]}" ${picked.has(x[0])?'checked':''}>${x[0]} - ${x[1]}${x[2]?'':' <span class="muted">（已关闭）</span>'}</label>`).join('');
  modal(`<h3>批量更改DSP名称</h3><div class="alert">已选 ${sel.size} 个合同，确认后这些合同的 DSP 名称替换为所选 DSP</div>
  <div class="f"><label><em>*</em>DSP 名称（可多选）</label><input id="sq" placeholder="搜索 seat / 公司名称"></div>
  <div id="sl" style="max-height:220px;overflow:auto;border:1px solid #f0f0f0;border-radius:4px;padding:4px 10px">${draw('')}</div>
  <div class="muted" style="font-size:12px;margin-top:6px">选项来自丘比特 DSP 列表（含已关闭）。修改从下一次取数生效。</div>
  <div class="err" id="derr"></div>
  <div class="foot"><button onclick="closeModal()">取消</button><button class="pri" id="dok">确认更改</button></div>`);
  const bindL=()=>document.querySelectorAll('[data-seat]').forEach(e=>e.onchange=()=>{e.checked?picked.add(e.dataset.seat):picked.delete(e.dataset.seat)});bindL();
  $('#sq').oninput=e=>{$('#sl').innerHTML=draw(e.target.value);bindL()};
  $('#dok').onclick=()=>{if(!picked.size)return $('#derr').textContent='请至少选择一个 DSP';
    sel.forEach(i=>{contractsApi[i].dsp=[...picked];contractsApi[i].t='2026-12-11 20:30';contractsApi[i].ub=ME});sel.clear();closeModal();render()};
}
function check(){const bad=drafts.filter(d=>d.changed&&!d.reason.trim());if(bad.length){const e=$('#adjErr');if(e)e.textContent='请填写调整原因：'+bad.map(d=>d.contract+' × '+d.dsp).join('、');return false}return true}
function doPush(){
  const p=previewData(),items=sum(p,c=>c.det.length),amt=sum(p,c=>c.amt),dsp=new Set(drafts.map(d=>d.dsp)).size;
  modal(`<h3>确认推送？</h3><p>合同数 ${p.length} ｜ DSP 数 ${dsp} ｜ 数据条数 ${items} ｜ 金额 $ ${fmt(amt)}</p><p class="muted">推送至 CRM 按 合同 × 国家 × 媒体；飞书通知展示同样的汇总。</p><div class="foot"><button onclick="closeModal()">取消</button><button class="pri" id="pok">确认</button></div>`);
  $('#pok').onclick=()=>{records.unshift({id:'R20261211001',biz:'api',month:sess.month,type:'收入计提',by:ME,c:p.length,d:dsp,i:items,amt,st:'推送中',t:'2026-12-11 20:30'});submitted('R20261211001')};
}
function submitted(id){
  modal(`<h3>✅ 已提交推送</h3><p class="muted">已提交推送，推送结果请到「计提记录」查看，完成后也会飞书通知你。</p>
  <div class="foot"><button id="bl">返回列表</button><button class="pri" id="gr">查看计提记录</button></div>`);
  $('#bl').onclick=()=>{closeModal();sess=null;render()};
  $('#gr').onclick=()=>{closeModal();sess=null;page='records';tab.records='api';render()};
}
function fModal(idx){
  const f=formulas[idx];
  const owner=b=>formulas.find((o,j)=>j!==idx&&o.biz.includes(b));
  modal(`<h3>编辑计提公式 · ${f.type}</h3>
  <div class="f"><label>公式</label><div class="muted">${EXPR[f.type]}</div></div>
  ${f.x!==null?`<div class="f"><label><em>*</em>参数 X（1-10 天）</label><input id="mx" type="number" value="${f.x}"></div>`:''}
  <div class="f"><label>适用业务线（可多选）</label><div>${BIZ_ALL.map(b=>{const o=owner(b);return `<label style="display:inline-flex;gap:4px;align-items:center;margin:2px 14px 2px 0;cursor:pointer"><input type="checkbox" style="width:auto;height:auto" data-b="${b}" ${f.biz.includes(b)?'checked':''}>${b}${o?`<span class="muted" style="font-size:11px">（当前：${o.type}）</span>`:''}</label>`}).join('')}</div></div>
  <div class="muted" style="font-size:12px">一条业务线只能适用一个公式；勾选已在其他公式中的业务线，保存后将从原公式移到本公式。</div>
  <div class="err" id="merr"></div>
  <div class="foot"><button onclick="closeModal()">取消</button><button class="pri" id="mok">保存</button></div>`);
  $('#mok').onclick=()=>{
    const x=f.x!==null?+$('#mx').value:null;
    if(x!==null&&(x<1||x>10))return $('#merr').textContent='参数 X 必须在 1-10 之间';
    const picked=[...document.querySelectorAll('[data-b]')].filter(e=>e.checked).map(e=>e.dataset.b);
    const lost=['广告-Miads','广告-API'].filter(b=>f.biz.includes(b)&&!picked.includes(b));
    if(lost.length)return $('#merr').textContent=`${lost.join('、')} 已接入计提，必须适用一个公式，请在其他公式中勾选后再取消`;
    formulas.forEach((o,j)=>{if(j!==idx)o.biz=o.biz.filter(b=>!picked.includes(b))});
    Object.assign(f,{x,biz:picked,upd:ME,t:'2026-12-11 20:30'});closeModal();render()};
}
document.querySelectorAll('aside a').forEach(a=>a.onclick=()=>{page=a.dataset.p;sess=null;render()});
$('#roleSel').onchange=e=>{role=e.target.value;sess=null;render()};
const SHOT=location.hash.slice(1);
if(SHOT){document.head.insertAdjacentHTML('beforeend','<style>.demo{display:none!important}</style>');
  const prep=()=>{buildDrafts();sess={month:'2026-12'};pv={};const d=drafts[0];splitTotal(d,40000);d.changed=true;d.saved=true;d.reason='按对方系统数据调整';};
  if(SHOT==='contract'){page='contract'}
  if(SHOT==='dsp'){page='contract';msOpen=1}
  if(SHOT==='gather'){page='accrual';buildDrafts();sess={month:'2026-12'};step=0}
  if(SHOT==='adjust'){page='accrual';prep();drafts[0].open=true;step=1}
  if(SHOT==='manual'){page='accrual';prep();step=2}
  if(SHOT==='preview'){page='accrual';prep();step=3;pv={'S003375':true}}
  if(SHOT==='start'){page='accrual'}
  if(SHOT==='record'){prep();const p=previewData();const fail={'S001283':'媒体名称不存在 1 条','C2023-0412':'签名校验失败'};
    const cs=p.map(c=>({code:c.code,st:fail[c.code]?'失败':'成功',n:c.det.length,why:fail[c.code]||'',amt:c.amt})).sort((a,b)=>(a.st==='失败'?0:1)-(b.st==='失败'?0:1));
    const dt=[];p.filter(c=>fail[c.code]).forEach(c=>c.det.forEach((x,j)=>dt.push([c.code,x.country,x.media,x.amt,'失败',c.code==='S001283'&&j===0?'媒体名称不存在':''])));
    records.unshift({id:'R20261211001',biz:'api',month:'2026-12',type:'收入计提',by:ME,c:p.length,d:7,i:sum(p,c=>c.det.length),amt:sum(p,c=>c.amt),st:'部分合同失败',t:'2026-12-11 20:30',cs,dt});
    sess=null;page='records';recOpen='R20261211001';rf.c='S001283'}
  if(SHOT==='records'){page='records';records.unshift({id:'R20261211001',biz:'api',month:'2026-12',type:'收入计提',by:ME,c:4,d:7,i:16,amt:253130.13,st:'推送中',t:'2026-12-11 20:30'});recQ='R20261211001'}
  if(SHOT==='submitted'){page='accrual';prep();step=3;setTimeout(()=>submitted('R20261211001'),0)}
}
render();
</script>
</body>
</html>
